name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  build-cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile CLI ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          bin="vpnban"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="vpnban.exe"; fi
          go build -trimpath -o "/tmp/${bin}" .

  build-desktop:
    name: Desktop Window App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin/arm64 }
          - { os: ubuntu-22.04, platform: linux/amd64 }
          - { os: windows-latest, platform: windows/amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ! sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config; then
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          fi

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Desktop Window App
        shell: bash
        run: |
          cd desktop
          BUILD_TAGS=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            if pkg-config --exists webkit2gtk-4.1 && ! pkg-config --exists webkit2gtk-4.0; then
              BUILD_TAGS="-tags webkit2_41"
            fi
          fi
          wails build -platform ${{ matrix.platform }} $BUILD_TAGS -clean -v 1
